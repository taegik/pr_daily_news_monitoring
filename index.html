      margin: 0 auto;
      background-color: var(--bg-page);
      min-height: 100vh;
    }

      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 16px 16px 15px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-md);
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .date-badge {

      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.16);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .header-right-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

      color: #ffffff;

      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }

      background: #1e293b;
      color: #ffffff;
    }

      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
    }

    .main-title {
      font-size: 1.22rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .sub-info {
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-top: 4px;
    }

    .quote-card {
      margin: 14px 14px 10px;
      background: #ffffff;
      border-radius: 14px;
      padding: 15px 17px;
      border-left: 4px solid #2563eb;
      box-shadow: var(--shadow-sm);
    }

    .quote-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: #2563eb;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }

    .quote-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.5;
      word-break: keep-all;
    }

    .quote-author {

      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      text-align: right;
    }

      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .category-nav::-webkit-scrollbar {
      display: none;
    }

      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;

      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(30, 58, 138, 0.25);
    }

      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
    }

    .cat-tab.active .cat-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

      justify-content: space-between;

      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;

      border-radius: 12px;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);

    .news-item:active {

      background-color: #f8fafc;
      border-color: var(--primary-accent);

      margin-bottom: 6px;
      gap: 8px;

    // 기본 데이터 매핑 (초기 로드 시 selected: true인 후보군을 임직원 노출 기사로 구성)
    const AFFILIATE_DATA = {};
    Object.keys(RAW_CONFIGS).forEach(key => {
      const c = RAW_CONFIGS[key];
      const activeArticles = c.candidates.filter(item => item.selected).map(item => ({
        category: item.category,
        press: item.press,
        title: item.title,
        url: item.url
      }));
      AFFILIATE_DATA[key] = {
        name: c.name,
        manager: c.manager,
        cycle: c.cycle,
        date: c.date,
        dayLabel: c.dayLabel,
        scrapeWindow: `${c.cycle} · 담당: ${c.manager} · 총 ${activeArticles.length}건`,
        quote: c.quote,
        author: c.author,
        articles: activeArticles
      };
    });

    // URL 파라미터(?corp=sangsangin 등)로 계열사 직접 링크 접속 지원
    const urlParams = new URLSearchParams(window.location.search);
    const paramCorp = urlParams.get("corp");
    let currentAffiliateKey = (paramCorp && AFFILIATE_DATA[paramCorp]) ? paramCorp : "medica";
    document.getElementById("affiliateSelector").value = currentAffiliateKey;

    let currentFilter = "all";

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2600);
    }

    let serverPublishedCache = {};

    async function fetchServerPublished(corpKey) {
      try {
        const res = await fetch("/api/published/" + corpKey);
        if (res.ok) {
          const json = await res.json();
          if (json.status === "ok" && json.data && Array.isArray(json.data.articles)) {
            serverPublishedCache[corpKey] = json.data;
            renderPage();
    fetchServerPublished(currentAffiliateKey);
          }
        }
      } catch (e) {}
    }

    function getActiveData() {
      if (serverPublishedCache[currentAffiliateKey]) {
        return serverPublishedCache[currentAffiliateKey];
      }
      try {
        const publishedRaw = localStorage.getItem("group_news_published_" + currentAffiliateKey);
        if (publishedRaw) {
          const parsed = JSON.parse(publishedRaw);
          if (parsed && Array.isArray(parsed.articles)) {
            return parsed;
          }
        }
      } catch (e) {}
      return AFFILIATE_DATA[currentAffiliateKey];
    }

    function renderPage() {
      const data = getActiveData();
      document.title = `[${data.date}] ${data.name} 모니터링`;
      document.getElementById("displayDateBadge").textContent = `📅 ${data.date} (${data.dayLabel || '금'})`;
      document.getElementById("headerMainTitle").textContent = `[${data.date}] ${data.name} 모니터링`;
      document.getElementById("headerSubInfo").textContent = data.scrapeWindow;
      document.getElementById("quoteText").textContent = `“${data.quote}”`;
      document.getElementById("quoteAuthor").textContent = `- ${data.author}`;

      const ownList = data.articles.filter(a => a.category === "own");
      const compList = data.articles.filter(a => a.category === "comp");
      const indList = data.articles.filter(a => a.category === "ind");

      document.getElementById("cntAll").textContent = data.articles.length;
      document.getElementById("cntOwn").textContent = ownList.length;
      document.getElementById("cntComp").textContent = compList.length;
      document.getElementById("cntInd").textContent = indList.length;

      const container = document.getElementById("sectionsContainer");
      container.innerHTML = "";

      const sections = [
        { key: "own", label: "[자사]", badgeClass: "badge-own", desc: "자사 직접 보도 (최우선)", items: ownList, showWhenEmpty: true },
        { key: "comp", label: "[경쟁사]", badgeClass: "badge-comp", desc: "주요 경쟁사 동향", items: compList, showWhenEmpty: false },
        { key: "ind", label: "[업계]", badgeClass: "badge-ind", desc: "정책·규제·산업 전반", items: indList, showWhenEmpty: false }
      ];

      let runningIndex = 1;

      sections.forEach(sec => {
        if (currentFilter !== "all" && currentFilter !== sec.key) return;
        if (!sec.showWhenEmpty && sec.items.length === 0 && currentFilter === "all") return;

        const secEl = document.createElement("section");
        secEl.className = "section-block";

        let bodyHtml = "";
        if (sec.items.length === 0) {
          bodyHtml = `<div class="empty-box">없음 (금일 자사 관련 신규 기사 없음)</div>`;
        } else {
          bodyHtml = `<div class="news-list">` + sec.items.map(item => {
            const num = runningIndex++;
            return `
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="news-item">
                <div class="news-item-top">
                  <span class="press-name">[${item.press}]</span>
                  <span class="item-num">#${String(num).padStart(2, '0')}</span>
                </div>
                <div class="news-headline">${item.title}</div>
                <div class="news-link-row">
                  <span class="short-url">${item.url}</span>
                  <span class="read-arrow">기사 원문 보기 →</span>
                </div>
              </a>
            `;
          }).join("") + `</div>`;
        }

        secEl.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">
              <span class="badge-sec ${sec.badgeClass}">${sec.label}</span>
              <span>${sec.desc}</span>
            </h2>
            <span style="font-size:0.78rem; font-weight:700; color:#64748b;">${sec.items.length}건</span>
          </div>
          ${bodyHtml}
        `;
        container.appendChild(secEl);
      });
    }

    function generateSmsText() {
      const data = getActiveData();
      const ownList = data.articles.filter(a => a.category === "own");
      const compList = data.articles.filter(a => a.category === "comp");
      const indList = data.articles.filter(a => a.category === "ind");

      const lines = [];
      lines.push(`[${data.date}] ${data.name} 모니터링`);
      lines.push("");
      lines.push(data.quote);
      lines.push(`- ${data.author}`);
      lines.push("");

      lines.push("[자사]");
      if (ownList.length === 0) {
        lines.push("없음");
        lines.push("");
      } else {
        ownList.forEach(a => {
          lines.push(`[${a.press}] ${a.title}`);
          lines.push(a.url);
          lines.push("");
        });
      }

      lines.push("[경쟁사]");
      if (compList.length === 0) {
        lines.push("없음");
        lines.push("");
      } else {
        compList.forEach(a => {
          lines.push(`[${a.press}] ${a.title}`);
          lines.push(a.url);
          lines.push("");
        });
      }

      lines.push("[업계]");
      if (indList.length === 0) {
        lines.push("없음");
      } else {
        indList.forEach(a => {
          lines.push(`[${a.press}] ${a.title}`);
          lines.push(a.url);
          lines.push("");
        });
      }

      return lines.join("\n").trim();
    }

    async function copyToClipboardRobust(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {}
      }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "0";
        ta.style.width = "2em";
        ta.style.height = "2em";
        ta.style.opacity = "0";
        ta.style.fontSize = "16px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) return true;
      } catch (e) {}
      return false;
    }

    document.getElementById("affiliateSelector").addEventListener("change", (e) => {
      currentAffiliateKey = e.target.value;
      currentFilter = "all";
      document.querySelectorAll(".cat-tab").forEach(t => t.classList.toggle("active", t.dataset.filter === "all"));
      document.getElementById("copyFallbackBox").classList.remove("open");
      renderPage();
    fetchServerPublished(currentAffiliateKey);
      showToast(`${getActiveData().name} 모니터링으로 전환되었습니다.`);
    });

    document.querySelectorAll(".cat-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        currentFilter = tab.dataset.filter;
        document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        renderPage();
    fetchServerPublished(currentAffiliateKey);
      });
    });

    document.getElementById("btnCopySmsFormat").addEventListener("click", async () => {
      const text = generateSmsText();
      const btn = document.getElementById("btnCopySmsFormat");
      const fallbackBox = document.getElementById("copyFallbackBox");
      const fallbackTextarea = document.getElementById("copyFallbackTextarea");

      const success = await copyToClipboardRobust(text);

      if (success) {
        btn.classList.add("copied");
        btn.textContent = "✅ 복사 완료! 카톡/문자에 바로 붙여넣으세요";
        showToast("문자/카톡 발송용 원문이 클립보드에 복사되었습니다!");
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.textContent = "📋 문자/카톡 발송용 원문 텍스트 복사";
        }, 2500);
      } else {
        fallbackTextarea.value = text;
        fallbackBox.classList.add("open");
        fallbackTextarea.focus();
        fallbackTextarea.select();
        fallbackTextarea.setSelectionRange(0, fallbackTextarea.value.length);
        showToast("아래 박스 텍스트를 길게 눌러 '복사'를 선택해주세요.");
      }
    });

    document.getElementById("btnCloseFallback").addEventListener("click", () => {
      document.getElementById("copyFallbackBox").classList.remove("open");
    });

    renderPage();
    fetchServerPublished(currentAffiliateKey);
  </script>
