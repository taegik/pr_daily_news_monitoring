    :root {
      --primary: #1e3a8a;
      --primary-accent: #2563eb;
      --primary-light: #eff6ff;
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --tag-own-bg: #fef2f2;
      --tag-own-text: #dc2626;
      --tag-comp-bg: #fff7ed;
      --tag-comp-text: #ea580c;
      --tag-ind-bg: #f0fdf4;
      --tag-ind-text: #16a34a;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--bg-page);
      min-height: 100vh;
    }

    /* Sticky Top Header & Affiliate Selector */
    .top-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 18px 16px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-md);
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.16);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .affiliate-select {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .affiliate-select option {
      background: #1e293b;
      color: #ffffff;
    }

    .main-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sub-info {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-top: 4px;
    }

    /* Daily Quote Card */
    .quote-card {
      margin: 14px 14px 10px;
      background: #ffffff;
      border-radius: 14px;
      padding: 16px 18px;
      border-left: 4px solid #2563eb;
      box-shadow: var(--shadow-sm);
    }

    .quote-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: #2563eb;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .quote-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.5;
      word-break: keep-all;
    }

    .quote-author {
      margin-top: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      text-align: right;
    }

    /* Sticky Category Tabs */
    .category-nav {
      position: sticky;
      top: 96px;
      z-index: 40;
      background: rgba(241, 245, 249, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .cat-tab {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .cat-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(30, 58, 138, 0.25);
    }

    .cat-count {
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
    }

    .cat-tab.active .cat-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    /* Section Container */
    .section-block {
      padding: 12px 14px 4px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .section-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-sec {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-own { background: var(--tag-own-bg); color: var(--tag-own-text); }
    .badge-comp { background: var(--tag-comp-bg); color: var(--tag-comp-text); }
    .badge-ind { background: var(--tag-ind-bg); color: var(--tag-ind-text); }

    /* Empty State for [자사] 없음 */
    .empty-box {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 600;
    }

    /* News Item Card */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .news-item {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: transform 0.12s ease, border-color 0.12s ease;
      position: relative;
    }

    .news-item:active {
      transform: scale(0.985);
      background-color: #f8fafc;
      border-color: var(--primary-accent);
    }

    .news-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 8px;
    }

    .press-name {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--primary-accent);
      background: var(--primary-light);
      padding: 2px 8px;
      border-radius: 5px;
    }

    .item-num {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .news-headline {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.45;
      word-break: keep-all;
      margin-bottom: 8px;
    }

    .news-link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
      font-size: 0.76rem;
      color: var(--text-sub);
    }

    .short-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #64748b;
      font-size: 0.75rem;
    }

    .read-arrow {
      font-weight: 700;
      color: var(--primary-accent);
    }

    /* Bottom Action Bar */
    .bottom-tools {
      margin: 20px 14px 0;
      padding: 16px;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid var(--border);
      text-align: center;

    .btn-copy-sms {

      padding: 13px 16px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 3px 8px rgba(30, 58, 138, 0.22);

    .btn-copy-sms:active {
      background: #172554;
    }

    .btn-copy-sms.copied {
      background: #16a34a;
    }

    /* Fallback Copy Preview Box (shown if clipboard API is restricted on mobile/iframe) */
    .copy-fallback-box {
      display: none;
      margin-top: 12px;
      text-align: left;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px;
    }

    .copy-fallback-box.open {
      display: block;
    }

    .copy-fallback-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #1e3a8a;
    }

    .copy-fallback-textarea {
      width: 100%;
      height: 150px;
      padding: 8px;
      font-size: 0.78rem;
      line-height: 1.45;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #0f172a;
      resize: vertical;
    }

    .footer-note {
      margin-top: 14px;
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 11px 20px;
      border-radius: 30px;
      font-size: 0.84rem;
      font-weight: 700;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

          const parsed = JSON.parse(publishedRaw);
          if (parsed && Array.isArray(parsed.articles)) {

          }

      } catch (e) {}
      return AFFILIATE_DATA[currentAffiliateKey];
    }

      document.getElementById("headerMainTitle").textContent = `[${data.date}] ${data.name} 모니터링`;
      document.getElementById("headerSubInfo").textContent = data.scrapeWindow;
      document.getElementById("quoteText").textContent = `“${data.quote}”`;
      document.getElementById("quoteAuthor").textContent = `- ${data.author}`;

      const ownList = data.articles.filter(a => a.category === "own");
      const compList = data.articles.filter(a => a.category === "comp");
      const indList = data.articles.filter(a => a.category === "ind");

      document.getElementById("cntAll").textContent = data.articles.length;
      document.getElementById("cntOwn").textContent = ownList.length;
      document.getElementById("cntComp").textContent = compList.length;
      document.getElementById("cntInd").textContent = indList.length;

      const container = document.getElementById("sectionsContainer");
      container.innerHTML = "";

      const sections = [
        { key: "own", label: "[자사]", badgeClass: "badge-own", desc: "자사 직접 보도 (최우선)", items: ownList, showWhenEmpty: true },
        { key: "comp", label: "[경쟁사]", badgeClass: "badge-comp", desc: "주요 경쟁사 동향", items: compList, showWhenEmpty: false },
        { key: "ind", label: "[업계]", badgeClass: "badge-ind", desc: "정책·약가·산업 전반", items: indList, showWhenEmpty: false }
      ];

      let runningIndex = 1;

      sections.forEach(sec => {
        if (currentFilter !== "all" && currentFilter !== sec.key) return;
        if (!sec.showWhenEmpty && sec.items.length === 0 && currentFilter === "all") return;

        const secEl = document.createElement("section");
        secEl.className = "section-block";

        let bodyHtml = "";
        if (sec.items.length === 0) {
          bodyHtml = `<div class="empty-box">없음 (금일 자사 관련 신규 기사 없음)</div>`;
        } else {
          bodyHtml = `<div class="news-list">` + sec.items.map(item => {
            const num = runningIndex++;
            return `
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="news-item">
                <div class="news-item-top">
                  <span class="press-name">[${item.press}]</span>
                  <span class="item-num">#${String(num).padStart(2, '0')}</span>
                </div>
                <div class="news-headline">${item.title}</div>
                <div class="news-link-row">
                  <span class="short-url">${item.url}</span>
                  <span class="read-arrow">기사 원문 보기 →</span>
                </div>
              </a>
            `;
          }).join("") + `</div>`;
        }

        secEl.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">
              <span class="badge-sec ${sec.badgeClass}">${sec.label}</span>
              <span>${sec.desc}</span>
            </h2>
            <span style="font-size:0.78rem; font-weight:700; color:#64748b;">${sec.items.length}건</span>
          </div>
          ${bodyHtml}
        `;
        container.appendChild(secEl);
      });
    }

    function generateSmsText() {
      const data = getActiveData();
      const ownList = data.articles.filter(a => a.category === "own");
      const compList = data.articles.filter(a => a.category === "comp");
      const indList = data.articles.filter(a => a.category === "ind");

      const lines = [];
      lines.push(`[${data.date}] ${data.name} 모니터링`);
      lines.push("");
      lines.push(data.quote);
      lines.push(`- ${data.author}`);
      lines.push("");

      lines.push("[자사]");
      if (ownList.length === 0) {
        lines.push("없음");
        lines.push("");
      } else {
        ownList.forEach(a => {
          lines.push(`[${a.press}] ${a.title}`);
          lines.push(a.url);
          lines.push("");
        });
      }

      lines.push("[경쟁사]");
      if (compList.length === 0) {
        lines.push("없음");
        lines.push("");
      } else {
        compList.forEach(a => {
          lines.push(`[${a.press}] ${a.title}`);
          lines.push(a.url);
          lines.push("");
        });
      }

      lines.push("[업계]");
      if (indList.length === 0) {
        lines.push("없음");
      } else {
        indList.forEach(a => {
          lines.push(`[${a.press}] ${a.title}`);
          lines.push(a.url);
          lines.push("");
        });
      }

      return lines.join("\n").trim();
    }

    // 모바일 사파리/크롬/인앱브라우저/로컬파일 환경까지 모두 지원하는 다중 클립보드 복사 함수
    async function copyToClipboardRobust(text) {
      // 1차 시도: 최신 Clipboard API (HTTPS 및 사용자 제스처 환경)
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          // 권한 거부 시 2차 폴백으로 진행
        }
      }

      // 2차 시도: 숨김 textarea + setSelectionRange (iOS Safari 호환 필수) + execCommand('copy')
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "0";
        ta.style.width = "2em";
        ta.style.height = "2em";
        ta.style.padding = "0";
        ta.style.border = "none";
        ta.style.outline = "none";
        ta.style.boxShadow = "none";
        ta.style.background = "transparent";
        ta.style.fontSize = "16px"; // iOS 자동 줌인 방지
        document.body.appendChild(ta);

        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);

        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) return true;
      } catch (e) {}

      return false;
    }

    document.getElementById("affiliateSelector").addEventListener("change", (e) => {
      currentAffiliateKey = e.target.value;
      currentFilter = "all";
      document.querySelectorAll(".cat-tab").forEach(t => t.classList.toggle("active", t.dataset.filter === "all"));
      document.getElementById("copyFallbackBox").classList.remove("open");
      renderPage();
      showToast(`${getActiveData().name} 모니터링으로 전환되었습니다.`);
    });

    document.querySelectorAll(".cat-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        currentFilter = tab.dataset.filter;
        document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        renderPage();
      });
    });

    document.getElementById("btnCopySmsFormat").addEventListener("click", async () => {
      const text = generateSmsText();
      const btn = document.getElementById("btnCopySmsFormat");
      const fallbackBox = document.getElementById("copyFallbackBox");
      const fallbackTextarea = document.getElementById("copyFallbackTextarea");

      const success = await copyToClipboardRobust(text);

      if (success) {
        btn.classList.add("copied");
        btn.textContent = "✅ 복사 완료! 카톡/문자에 바로 붙여넣으세요";
        showToast("문자/카톡 발송용 원문이 클립보드에 복사되었습니다!");
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.textContent = "📋 문자/카톡 발송용 원문 텍스트 복사";
        }, 2500);
      } else {
        // 클립보드 권한이 막힌 특수 인앱 브라우저일 경우 텍스트 영역을 즉시 펼쳐 전체 선택
        fallbackTextarea.value = text;
        fallbackBox.classList.add("open");
        fallbackTextarea.focus();
        fallbackTextarea.select();
        fallbackTextarea.setSelectionRange(0, fallbackTextarea.value.length);
        showToast("아래 박스 텍스트를 길게 눌러 '복사'를 선택해주세요.");
      }
    });

    document.getElementById("btnCloseFallback").addEventListener("click", () => {
      document.getElementById("copyFallbackBox").classList.remove("open");
    });

    renderPage();
  </script>
</body>
</html>
