name: Archive Published News

# 관리자 페이지에서 발행(published_data.json 수정)하면 자동으로 지난 기사 아카이브를 갱신합니다.
on:
  push:
    branches: [main]
    paths:
      - 'published_data.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build archive (image/summary enrich + 90-day retention)
        env:
          RUN_MODE: archive
        run: python scrape_naver.py

      - name: Commit and push archive
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add published_data.json archive
          if git diff --staged --quiet; then
            echo "No archive changes."
          else
            git commit -m "chore: update archive [skip ci]"
            git pull --rebase origin main
            git push
          fi
