name: Daily News Scrape

on:
  schedule:
    # 매일 오전 6시 30분(한국시간 = UTC+9) 자동 수집: 21:30 UTC = KST 06:30
    # 주말·공휴일·회사 휴무일은 프로그램이 알아서 건너뛰고, 다음 영업일에 쉬는 기간까지 함께 수집합니다.
    #  - 상상인·엠아이텍·시너지이노베이션·메디카코리아 : 직전 영업일 00:00 ~ 당일 06:30
    #  - 뉴로바이오젠·사회공헌 : 그 주 마지막 영업일(보통 금요일) 에만, 지난주 같은 요일 00:00 ~ 당일 06:30
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      affiliate:
        description: '수집 대상 (all, 또는 쉼표로 여러 개: sangsangin,mitech,synergy,medica,neurobiogen,csr)'
        required: false
        default: 'all'
      start_date:
        description: '시작일 YYYY-MM-DD (비우면 자동: 직전 영업일 00:00~지금, 주 1회 발행 대상은 최근 7일)'
        required: false
        default: ''
      end_date:
        description: '종료일 YYYY-MM-DD (비우면 현재)'
        required: false
        default: ''
      add_urls:
        description: '[URL 직접 추가용] 기사 주소(공백으로 구분). 입력하면 수집 대신 이 기사만 추가합니다. 구분값은 위 affiliate 한 곳.'
        required: false
        default: ''

permissions:
  contents: write

# 데이터 파일을 쓰는 작업은 한 번에 하나씩만 실행
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install holiday calendar
        run: pip install holidays || echo "holidays 설치 실패 - 내장 공휴일 목록을 사용합니다"

      - name: Run news scraper
        id: scrape
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          RUN_MODE: ${{ github.event.inputs.add_urls && 'addurls' || 'scrape' }}
          ADD_URLS: ${{ github.event.inputs.add_urls || '' }}
          TARGET_AFFILIATE: ${{ github.event.inputs.affiliate || 'all' }}
          START_DATE: ${{ github.event.inputs.start_date || '' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: python scrape_naver.py

      - name: Commit and push scraped data
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scraped_pool.json archive/stats.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes in scraped news."
          else
            git commit -m "chore: update scraped news [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Notify on failure (optional Slack webhook)
        if: steps.scrape.outcome == 'failure' && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"[뉴스 모니터링] 자동 수집 실패 또는 0건 - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Fail the run when collection failed (sends GitHub failure alert)
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "수집 실패 또는 0건입니다. 위 'Run news scraper' 로그의 [수집 진단]을 확인하세요."
          exit 1
